<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>별의 진화 3D 애니메이터</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--panel:rgba(6,10,22,.6);--line:rgba(150,180,255,.16);--txt:#e9efff;--sub:#9aabd4;--acc:#ffd27a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--txt);font-family:'Noto Sans KR',system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{position:fixed;background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px}
button{font:inherit;color:inherit;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:9px;padding:6px 11px;cursor:pointer;transition:.15s}
button:hover{background:rgba(255,255,255,.14)}
button.on{background:var(--acc);color:#1a1200;border-color:var(--acc);font-weight:700}
header{top:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:6px;align-items:center;max-width:calc(100vw - 24px);overflow-x:auto}
header h1{font-size:15px;font-weight:900;padding:0 10px 0 6px;white-space:nowrap;letter-spacing:-.02em}
header button{white-space:nowrap;font-size:13px;line-height:1.25;text-align:center}
header button small{display:block;font-size:10.5px;opacity:.75;font-weight:500}
#info{top:74px;left:12px;width:340px;padding:16px 16px 14px;max-height:calc(100vh - 210px);overflow:auto}
#info .tag{font-size:11.5px;color:var(--acc);font-weight:700;letter-spacing:.04em}
#info h2{font-size:21px;font-weight:900;margin:3px 0 2px;letter-spacing:-.03em;line-height:1.25}
#info .ex{font-size:12.5px;color:var(--sub);margin-bottom:10px}
#stats{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:8px 0 10px;padding:10px 12px;background:rgba(255,255,255,.04);border-radius:10px}
#stats b{color:var(--sub);font-weight:500}
#desc{font-size:13.5px;line-height:1.65;color:#d6def5}
#legend{margin-top:10px;font-size:12px;display:none}
#legend div{display:flex;align-items:center;gap:7px;margin:3px 0}
#legend i{width:12px;height:12px;border-radius:3px;flex:none}
#sizeBox{margin-top:12px}
#sizeBox .h{font-size:11.5px;color:var(--sub);margin-bottom:4px}
#hrBox{top:74px;right:12px;padding:10px 10px 6px}
.cap{font-size:11.5px;color:var(--sub);margin-bottom:4px;font-weight:500}
#pulseBox{right:12px;padding:10px;display:none}
#bar{left:12px;right:12px;bottom:12px;padding:10px 14px 12px}
#row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#chips{display:flex;gap:4px;flex:1;min-width:200px;overflow-x:auto}
#chips button{font-size:12px;padding:5px 9px;white-space:nowrap;position:relative;overflow:hidden}
#chips button .fill{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);width:0}
#chips button.on .fill{background:#1a1200}
#scrub{width:100%;margin-top:9px;accent-color:#ffd27a;cursor:pointer}
.sep{width:1px;height:24px;background:var(--line)}
#tog{display:flex;gap:4px}
#tog button{font-size:12px}
#title{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity 1s;text-shadow:0 2px 30px #000}
#title .a{font-size:14px;color:var(--acc);font-weight:700;letter-spacing:.2em}
#title .b{font-size:46px;font-weight:900;letter-spacing:-.03em}
#caption{position:fixed;bottom:118px;left:50%;transform:translateX(-50%);font-size:17px;font-weight:700;padding:9px 18px;background:rgba(0,0,0,.45);border-radius:30px;border:1px solid var(--line);white-space:nowrap;transition:opacity .4s;pointer-events:none}
#flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,#fff 0%,#e8f0ff 35%,rgba(200,220,255,.5) 100%);opacity:0}
#hint{position:fixed;right:14px;bottom:110px;font-size:11.5px;color:var(--sub);text-align:right;pointer-events:none;line-height:1.6}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:16px;text-align:center;padding:30px;line-height:1.7}
@media (max-width:900px){#info{width:calc(100vw - 24px);max-height:34vh;top:auto;bottom:150px}#hrBox,#hint{display:none}#caption{bottom:auto;top:76px;font-size:14px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<header class="panel"><h1>✦ 별의 진화 3D</h1><span id="masses" style="display:flex;gap:5px"></span></header>
<aside id="info" class="panel">
  <div class="tag" id="tag"></div>
  <h2 id="pname"></h2>
  <div class="ex" id="pex"></div>
  <div id="stats"></div>
  <div id="desc"></div>
  <div id="legend"></div>
  <div id="sizeBox"><div class="h">실제 크기 비교</div><canvas id="size" width="308" height="74" style="width:308px;height:74px"></canvas></div>
</aside>
<div id="hrBox" class="panel"><div class="cap">H-R도 — 진화 경로</div><canvas id="hr" style="width:280px;height:240px"></canvas></div>
<div id="pulseBox" class="panel"><div class="cap">펄서 신호 (관측자 방향 빔 세기)</div><canvas id="pulse" style="width:280px;height:70px"></canvas></div>
<div id="title"><div class="a" id="ta"></div><div class="b" id="tb"></div></div>
<div id="caption"></div>
<div id="hint">드래그: 회전 · 휠: 확대/축소<br>Space: 재생/정지 · ← →: 단계 이동</div>
<footer id="bar" class="panel">
  <div id="row">
    <button id="restart" title="처음부터">⏮</button>
    <button id="play" style="min-width:44px">❚❚</button>
    <button id="spd">1×</button>
    <div class="sep"></div>
    <div id="chips"></div>
    <div class="sep"></div>
    <div id="tog">
      <button id="tCut" title="별의 내부 구조를 잘라서 보기">단면 보기</button>
      <button id="tRot" class="on" title="카메라 자동 회전">자동 회전</button>
      <button id="tQ" title="해상도 (느린 컴퓨터는 '보통')">화질: 보통</button>
    </div>
  </div>
  <input id="scrub" type="range" min="0" max="100" step="0.01" value="0">
</footer>
<div id="err"></div>

<script type="importmap">

</script>
<script type="module">

const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

const vis = R => R >= 1 ? Math.pow(R, 0.85) : Math.pow(R, 0.45);   // 실제 반지름(R☉) → 화면 반지름 (거성은 거의 실제 비율)

catch (e) { $('err').style.display = 'flex'; $('err').textContent = 'WebGL2를 사용할 수 없는 환경입니다. 최신 크롬/엣지에서 열어 주세요.'; throw e; }
let qHigh = false;
const setPR = () => renderer.setPixelRatio(Math.min(devicePixelRatio, qHigh ? 2 : 1));
setPR();
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 60000);
camera.position.set(0, 1.4, 6);
const controls = new OrbitControls(camera, canvas);
Object.assign(controls, { enableDamping: true, enableZoom: false, enablePan: false, autoRotate: true, autoRotateSpeed: 0.3, rotateSpeed: 0.6 });
const composer = new EffectComposer(renderer);

// 3D 노이즈 텍스처 (모든 셰이더 공용)
function makeNoise(S = 64) {
  const n = S * S * S, M = S - 1; let a = new Float32Array(n), b = new Float32Array(n);
  for (let i = 0; i < n; i++) a[i] = Math.random();
  const id = (x, y, z) => ((z & M) * S + (y & M)) * S + (x & M);
  for (let pass = 0; pass < 3; pass++) for (let ax = 0; ax < 3; ax++) {
    for (let z = 0; z < S; z++) for (let y = 0; y < S; y++) for (let x = 0; x < S; x++)
      b[id(x, y, z)] = (ax === 0 ? a[id(x - 1, y, z)] + a[id(x + 1, y, z)] : ax === 1 ? a[id(x, y - 1, z)] + a[id(x, y + 1, z)] : a[id(x, y, z - 1)] + a[id(x, y, z + 1)]) / 3 + a[id(x, y, z)] / 3;
    [a, b] = [b, a];
  }
  let mean = 0, v = 0; for (let i = 0; i < n; i++) mean += a[i]; mean /= n;
  for (let i = 0; i < n; i++) v += (a[i] - mean) ** 2; const sd = Math.sqrt(v / n);
  const out = new Uint8Array(n);
  for (let i = 0; i < n; i++) out[i] = clamp(Math.round((0.5 + (a[i] - mean) / sd * 0.18) * 255), 0, 255);
  const t = new THREE.Data3DTexture(out, S, S, S);
  t.format = THREE.RedFormat; t.minFilter = t.magFilter = THREE.LinearFilter;
  t.wrapS = t.wrapT = t.wrapR = THREE.RepeatWrapping; t.unpackAlignment = 1; t.needsUpdate = true;
  return t;
}
const NOISE = { value: makeNoise() };

const GL = /* glsl */`
uniform highp sampler3D uNoise;
float N(vec3 p){ return (texture(uNoise,p).r-.5)*2.75; }
float fbm3(vec3 p){ return N(p)*.55+N(p*2.03+.37)*.3+N(p*4.07+.71)*.15; }
float hash12(vec2 p){ vec3 q=fract(vec3(p.xyx)*.1031); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
float hash13(vec3 p){ p=fract(p*.1031); p+=dot(p,p.zyx+31.32); return fract((p.x+p.y)*p.z); }
vec3 hash33(vec3 p){ p=fract(p*vec3(.1031,.1030,.0973)); p+=dot(p,p.yxz+33.33); return fract((p.xxy+p.yxx)*p.zyx); }
vec3 worley(vec3 p,float tm){ vec3 i=floor(p), f=fract(p); float d1=8., d2=8., id=0.;
  for(int z=-1;z<=1;z++) for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){
    vec3 g=vec3(x,y,z), h=hash33(i+g), o=.5+.42*sin(tm+6.2831*h), r=g+o-f; float d=dot(r,r);
    if(d<d1){ d2=d1; d1=d; id=h.x; } else if(d<d2) d2=d; }
  return vec3(sqrt(d1),sqrt(d2),id); }

  float r = t<=66. ? 1. : clamp(1.292936*pow(t-60.,-.1332048),0.,1.);
  float g = t<=66. ? clamp(.3900816*log(t)-.6318414,0.,1.) : clamp(1.1298909*pow(t-60.,-.0755148),0.,1.);
  float b = t>=66. ? 1. : (t<=19. ? 0. : clamp(.5432068*log(t-10.)-1.1962541,0.,1.));
  return pow(vec3(r,g,b),vec3(2.2)); }
`;
function bbJS(T) { // 흑체 색 (선형 RGB)

  const r = t <= 66 ? 1 : clamp(1.292936 * Math.pow(t - 60, -.1332048), 0, 1);
  const g = t <= 66 ? clamp(.3900816 * Math.log(t) - .6318414, 0, 1) : clamp(1.1298909 * Math.pow(t - 60, -.0755148), 0, 1);

const world = new THREE.Group(); scene.add(world);

// ── 배경 하늘 (은하수 + 별 + 블랙홀 중력렌즈) ──
const sky = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, depthTest: false,
  uniforms: { uNoise: NOISE, uBH: { value: 0 }, uTime: { value: 0 }, uDiskI: { value: 0 }, uDiskT: { value: 5200 } },
  vertexShader: `varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
  fragmentShader: GL + /* glsl */`
uniform float uBH,uTime,uDiskI,uDiskT; varying vec3 vW;
const float RIN=3., ROUT=12., RS=.6;
vec3 starLayer(vec3 d,float sc,float dens,float rad,float bright){
  vec3 p=d*sc, id=floor(p), f=fract(p);
  if(hash13(id)>dens) return vec3(0.);
  vec3 df=f-(hash33(id)*.7+.15); df-=d*dot(df,d);

vec3 sky(vec3 d){

  float bul=pow(max(dot(d,core),0.),5.)*exp(-lat*lat*7.);

  c*=1.-.85*dust;
  c+=vec3(.9,.22,.32)*smoothstep(.3,.95,fbm3(d*1.7+11.))*exp(-lat*lat*4.)*.012;
  c+=starLayer(d,85.,.22,.075,2.)+starLayer(d,210.,.2,.12,.8)+starLayer(d,460.,.16,.2,.45)*(.3+band*2.2);

  float rot=ang-uTime*3.*pow(r,-1.5)*2.2;
  float st=fbm3(vec3(cos(rot)*1.3,sin(rot)*1.3,r*.65));
  float n=N(vec3(cos(rot)*3.,sin(rot)*3.,r*1.7));

  vec3 acc=vec3(0.); float al=0.;
  for(int i=0;i<260;i++){
    float r=length(x);
    if(r<1.) return acc;
    float dt=clamp(.075*r,.025,8.);
    vec3 xo=x;
    v+=-1.5*h2*x/pow(r,5.)*dt; x+=v*dt;

// ── 볼류메트릭 성운 (레이마칭) ──

    cutDisk.quaternion.copy(camera.quaternion); cutDisk.scale.setScalar(F.starVis * .97);
    cutU.uN.value = L.length; cutU.uTime.value = time;
    L.forEach((l, i) => { const col = new THREE.Color(l[1]); cutU.uL.value[i].set(col.r, col.g, col.b, l[0]); cutU.uC.value[i] = l[3] ? 1 : 0; });
  }

  // 펄서 신호
  $('pulseBox').style.display = F.pulsar ? 'block' : 'none';
  if (F.pulsar) {
    const bd = new THREE.Vector3(0, 1, 0).applyQuaternion(magG.getWorldQuaternion(new THREE.Quaternion()));
    const tc = tmpV.copy(camera.position).sub(world.position).normalize(), dp = bd.dot(tc);
    const s = Math.pow(Math.max(dp, 0), 40) + Math.pow(Math.max(-dp, 0), 40);
    drawPulse(s); glow.material.uniforms.uI.value = 1 + s * 6;
    $('pulseBox').style.top = ($('hrBox').getBoundingClientRect().bottom + 8) + 'px';
  }

  renderer.toneMappingExposure = F.expo;
  bloom.strength = .6 + F.bloom;
  $('flash').style.opacity = F.flash;

function loop() { frame(); requestAnimationFrame(loop); }
buildMass(); syncPlay();
// 콘솔 디버그용: SE.seek(질량번호, 단계번호, 진행률)
window.SE = { OV, parts, vols, step(n = 1) { for (let i = 0; i < n; i++) frame(); }, dbg: () => ({ rt: [composer.renderTarget1.width, composer.renderTarget1.height], calls: renderer.info.render.calls, camDist, frame: F.frame, cam: camera.position.toArray(), prog: renderer.info.programs.length }), seek(mi, i, p = 0) { if (mi !== massIdx) { massIdx = mi; buildMass(); } const ph = MASSES[mi].phases[i]; tNow = ph.start + ph.dur * p; playing = false; syncPlay(); camDist = NaN; userZoom = 1; } };
requestAnimationFrame(loop);
